name: Sao lưu database

# Mỗi ngày 03:00 (giờ VN) xuất toàn bộ database, MÃ HÓA rồi lưu thành file trong tab Actions (giữ 30 ngày).
# Bật bằng cách thêm 2 Secret trong GitHub: Settings > Secrets and variables > Actions:
#   BACKUP_DATABASE_URL  = chuỗi kết nối Postgres (cùng giá trị DATABASE_URL trên Render)
#   BACKUP_PASSPHRASE    = mật khẩu tự đặt để mã hóa file sao lưu (GHI NHỚ, mất là không giải mã được)
# Chưa thêm Secret thì workflow tự bỏ qua, không báo lỗi.
on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Kiểm tra đã cấu hình Secret chưa
        id: cfg
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASSPHRASE" ]; then
            echo "Chưa cấu hình BACKUP_DATABASE_URL / BACKUP_PASSPHRASE - bỏ qua."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Xuất database (pg_dump)
        if: steps.cfg.outputs.ready == 'true'
        run: |
          docker run --rm -e DB_URL postgres:18-alpine sh -c 'pg_dump --no-owner --no-privileges --format=custom "$DB_URL"' > backup.dump
          ls -lh backup.dump
      - name: Mã hóa (AES-256)
        if: steps.cfg.outputs.ready == 'true'
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:PASSPHRASE -in backup.dump -out "backup-$(date -u +%F).dump.enc"
          rm backup.dump
      - uses: actions/upload-artifact@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          name: db-backup
          path: backup-*.dump.enc
          retention-days: 30
